<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园知识库问答 Agent</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f9fafb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }

    header h1 { font-size: 26px; margin-bottom: 6px; }
    header .sub { color: var(--muted); font-size: 14px; }
    header .meta {
      margin-top: 12px; font-size: 13px; color: var(--muted);
    }
    header .meta span {
      display: inline-block; background: #fff; border: 1px solid var(--border);
      border-radius: 6px; padding: 2px 10px; margin-right: 8px; margin-top: 6px;
    }

    /* 评测数字卡 */
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px; margin: 24px 0;
    }
    .stat {
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px;
    }
    .stat .num { font-size: 24px; font-weight: 700; color: var(--primary); }
    .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* 提问区 */
    .chatbox {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; margin-top: 8px;
    }
    #qa { min-height: 120px; }
    .q { margin-top: 16px; }
    .q .who { font-weight: 700; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
    .q .qtext {
      background: var(--bg); border-radius: 8px; padding: 10px 14px; font-size: 15px;
    }
    .a .who { font-weight: 700; color: var(--primary); font-size: 13px; margin-bottom: 4px; }
    .a .atext {
      font-size: 15px; white-space: pre-wrap; word-break: break-word;
    }
    .hits { margin-top: 12px; }
    .hits .hits-title { font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
    .hit {
      border-left: 3px solid var(--primary); background: #f0f5ff;
      border-radius: 6px; padding: 8px 12px; margin-bottom: 8px;
    }
    .hit .h-title { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
    .hit .h-text { font-size: 13px; color: #374151; }
    .hit .h-score { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .err { color: #dc2626; font-size: 14px; margin-top: 12px; }
    .loading { color: var(--muted); font-size: 14px; margin-top: 12px; }

    /* 输入区 */
    .input-row { display: flex; gap: 10px; margin-top: 16px; }
    #question {
      flex: 1; padding: 12px 14px; font-size: 15px; border: 1px solid var(--border);
      border-radius: 8px; outline: none;
    }
    #question:focus { border-color: var(--primary); }
    #send {
      padding: 0 22px; font-size: 15px; font-weight: 600; color: #fff;
      background: var(--primary); border: none; border-radius: 8px; cursor: pointer;
    }
    #send:hover { background: #1e40af; }
    #send:disabled { background: #9ca3af; cursor: not-allowed; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .clear-link { float: right; font-size: 12px; color: var(--muted); cursor: pointer; margin-top: 8px; }
    .clear-link:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>校园知识库问答 Agent</h1>
      <div class="sub">从零手写 RAG，用数据量化检索的每一层 —— 点下面随便问一个问题试试</div>
      <div class="meta">
        <span>知识库 {{ blocks }} 块</span>
        <span>检索器 {{ retriever }}</span>
        <span>Top-K {{ top_k }}</span>
        <span>模式 {{ mode }}</span>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><div class="num">96.3%</div><div class="lbl">向量检索 Top-1 命中</div></div>
      <div class="stat"><div class="num">0.982</div><div class="lbl">向量 MRR（排名精度）</div></div>
      <div class="stat"><div class="num">37 → 2</div><div class="lbl">向量检索请求次数优化</div></div>
      <div class="stat"><div class="num">0/2 → 2/2</div><div class="lbl">跨块召回（字频 → 向量）</div></div>
    </div>

    <div class="chatbox">
      <span class="clear-link" onclick="clearMemory()">清空记忆</span>
      <div id="qa"></div>
      <div class="input-row">
        <input id="question" type="text" placeholder="例如：选课时间是什么时候？" autocomplete="off">
        <button id="send" onclick="ask()">发送</button>
      </div>
      <div class="hint">试试问：「什么是 RAG」「找算法实习的时间线」「奖学金怎么申请」</div>
    </div>
  </div>

  <script>
    const qa = document.getElementById('qa');
    const input = document.getElementById('question');
    const send = document.getElementById('send');

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') ask();
    });

    function ask() {
      const q = input.value.trim();
      if (!q) return;
      appendQuestion(q);
      input.value = '';
      setBusy(true);

      fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q }),
      })
      .then(r => r.json())
      .then(data => {
        setBusy(false);
        if (data.error) {
          appendError(data.error);
        } else {
          appendAnswer(data.answer, data.hits || []);
        }
      })
      .catch(err => {
        setBusy(false);
        appendError('请求失败：' + err);
      });
    }

    function appendQuestion(q) {
      const div = document.createElement('div');
      div.className = 'q';
      div.innerHTML = '<div class="who">你</div><div class="qtext"></div>';
      div.querySelector('.qtext').textContent = q;
      qa.appendChild(div);
      scrollBottom();
    }

    function appendAnswer(answer, hits) {
      const div = document.createElement('div');
      div.className = 'a';
      div.style.marginTop = '16px';
      div.innerHTML = '<div class="who">助手</div><div class="atext"></div>';
      div.querySelector('.atext').textContent = answer;
      qa.appendChild(div);

      if (hits && hits.length) {
        const hitsDiv = document.createElement('div');
        hitsDiv.className = 'hits';
        let html = '<div class="hits-title">本轮检索命中的知识块</div>';
        hits.forEach(h => {
          html += '<div class="hit">' +
            '<div class="h-title">' + h.rank + '. ' + escapeHtml(h.title) + '</div>' +
            '<div class="h-text">' + escapeHtml(h.text.slice(0, 120)) + (h.text.length > 120 ? '…' : '') + '</div>' +
            '<div class="h-score">相关度 ' + h.score + '</div>' +
            '</div>';
        });
        hitsDiv.innerHTML = html;
        qa.appendChild(hitsDiv);
      }
      scrollBottom();
    }

    function appendError(msg) {
      const div = document.createElement('div');
      div.className = 'err';
      div.textContent = '出错了：' + msg;
      qa.appendChild(div);
      scrollBottom();
    }

    function setBusy(b) {
      send.disabled = b;
      send.textContent = b ? '思考中…' : '发送';
    }

    function clearMemory() {
      fetch('/clear', { method: 'POST' })
        .then(() => { qa.innerHTML = ''; });
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function scrollBottom() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
  </script>
</body>
</html>
